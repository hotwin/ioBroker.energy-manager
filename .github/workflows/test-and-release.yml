name: Test and Release

on:
  push:
    branches: [main, 'develop/0.3.0-beta.1', 'develop/**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-**']
  workflow_dispatch:
    inputs:
      check_repository:
        description: Run the official repository gate for this candidate
        type: boolean
        default: false
      admission_issue:
        description: GitHub issue or PR documenting an approved ioBroker admission exception
        type: string
        required: false
      publish_beta:
        description: Publish the checked beta package to npm
        type: boolean
        default: false
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint and check dashboard copies
        run: npm run lint && npm run check:dashboard
      - name: Official package tests
        run: npm run test:package
      - name: Validate package
        run: npm pack --dry-run

  adapter-tests:
    needs: check-and-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm run test:unit
      - name: Integration and Compact Mode tests
        run: npm run test:integration

  repository-check:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.check_repository || inputs.publish_beta)) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop/repository-checker-24' || github.ref == 'refs/heads/develop/release-gate-bootstrap-24'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install official Repository Checker 5.24.3
        run: |
          checker="$RUNNER_TEMP/repochecker"
          git init "$checker"
          git -C "$checker" remote add origin https://github.com/ioBroker/ioBroker.repochecker.git
          git -C "$checker" fetch --depth=1 origin 755ec6ddde9fd3c9914cd818986ee134a32c4874
          git -C "$checker" checkout --detach FETCH_HEAD
          npm --prefix "$checker" ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Validate the exact candidate with the official checker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IOBROKER_ADMISSION_ISSUE: ${{ inputs.admission_issue }}
        run: node scripts/check-repository.js "$RUNNER_TEMP/repochecker"

  publish-beta:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_beta && github.ref == 'refs/heads/main'
    needs: [check-and-lint, adapter-tests, repository-check]
    runs-on: ubuntu-latest
    environment: npm-beta
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify package name and beta version
        run: |
          node <<'NODE'
          const pkg = require('./package.json');
          const adapter = require('./io-package.json');
          if (pkg.name !== 'iobroker.hotwin-energy-manager' ||
              !/^\d+\.\d+\.\d+-beta\.\d+$/.test(pkg.version) ||
              pkg.version !== adapter.common.version) {
            throw new Error('Expected matching Energy Manager beta package metadata.');
          }
          NODE
      - name: Verify npm supports trusted publishing
        run: |
          node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)" "$(npm --version)"
      - name: Publish to npm under the beta tag using OIDC
        run: npm publish --tag beta
