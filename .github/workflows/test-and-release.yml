name: Test and Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}
  workflow_dispatch:
    inputs:
      admission_issue:
        description: Documented approved ioBroker admission exception
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '22.x'
          lint: true
      - run: npm run check:dashboard
      - run: npm pack --dry-run

  adapter-tests:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}

  repository-check:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Confirm release tag belongs to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Install official Repository Checker 5.24.3
        run: |
          checker="$RUNNER_TEMP/repochecker"
          git init "$checker"
          git -C "$checker" remote add origin https://github.com/ioBroker/ioBroker.repochecker.git
          git -C "$checker" fetch --depth=1 origin 755ec6ddde9fd3c9914cd818986ee134a32c4874
          git -C "$checker" checkout --detach FETCH_HEAD
          npm --prefix "$checker" ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Validate the exact candidate with the official checker
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IOBROKER_ADMISSION_ISSUE: ${{ inputs.admission_issue }}
        run: node scripts/check-repository.js "$RUNNER_TEMP/repochecker"

  deploy:
    needs: [check-and-lint, adapter-tests, repository-check]
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm-beta
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: '24.x'
          github-token: ${{ secrets.GITHUB_TOKEN }}
