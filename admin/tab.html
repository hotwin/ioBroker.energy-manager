<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Energy Manager</title>
    <style>
        :root { color-scheme: light; --ink: #183135; --muted: #50666b; --teal: #08796e; --line: #d6e5e3; --paper: #fff; }
        * { box-sizing: border-box; }
        body { margin: 0; color: var(--ink); background: #f0f6f5; font: 15px/1.5 system-ui, sans-serif; }
        main { margin: auto; max-width: 1260px; padding: clamp(10px, 2.5vw, 32px); }
        header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
        h1, h2, h3, p { margin: 0; }
        h1 { font-size: clamp(25px, 5vw, 38px); letter-spacing: -.045em; }
        h2 { font-size: 22px; margin-bottom: 14px; }
        nav { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 16px; }
        nav a { padding: 8px 11px; border-radius: 8px; text-decoration: none; font-weight: 600; }
        a { color: var(--teal); }
        nav a[aria-current] { background: #dff1ed; color: #075b52; }
        :focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 12px; }
        article, .surface { padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
        article p, small, #status, .note { color: var(--muted); }
        .value { display: block; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 25px; overflow-wrap: anywhere; }
        .summary-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .summary-panel { flex: 1 1 270px; min-width: 0; padding: 12px; }
        .summary-panel h3 { font-size: 16px; margin-bottom: 10px; }
        .summary-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(112px, 100%), 1fr));
            gap: 4px 12px;
        }
        .summary-metric {
            display: block;
            min-width: 0;
            padding: 6px 0;
            color: var(--ink);
            text-decoration: none;
            overflow-wrap: anywhere;
        }
        a.summary-metric:hover .tile-value { color: var(--teal); text-decoration: underline; }
        .summary-note { display: block; margin-top: 4px; }
        .tile-label { display: block; color: var(--muted); font-size: 13px; line-height: 1.3; }
        .tile-value { display: block; margin-top: 3px; font-size: 19px; font-variant-numeric: tabular-nums; }
        .scroll { overflow: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { border-bottom: 1px solid var(--line); padding: 10px; }
        th, td:not(:first-child) { white-space: nowrap; }
        td:first-child { min-width: 130px; overflow-wrap: anywhere; }
        .stats-header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
        select { padding: 6px; font: inherit; max-width: 100%; }
        .contract-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 14px; }
        .contract-fields label { display: grid; align-content: start; gap: 3px; }
        .contract-fields input, .contract-fields select { width: 100%; min-width: 0; padding: 8px; font: inherit; }
        #contractForm fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
        #contractForm button { font: inherit; padding: 8px 16px; }
        #statsBars { display: grid; gap: 5px; max-height: 520px; overflow: auto; }
        .stat-row { display: grid; grid-template-columns: 85px minmax(20px, 1fr) 95px; gap: 6px; align-items: center; }
        progress { width: 100%; accent-color: var(--teal); }
        .note { margin-block: 12px; }
        [hidden] { display: none !important; }
        .device-name { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
        .device-edit { border: 0; background: transparent; color: var(--teal); cursor: pointer; border-radius: 6px; min-width: 32px; min-height: 32px; font: inherit; font-size: 20px; }
        .device-edit:hover { background: #e8f5f3; }
        .device-details { flex-basis: 100%; color: var(--muted); font-size: .85em; }
        .device-details summary { cursor: pointer; }
        #aliasDialog { width: min(calc(100% - 32px), 440px); box-sizing: border-box; padding: 24px; color: var(--ink); }
        #aliasDialog::backdrop { background: rgb(24 49 53 / 45%); }
        #aliasForm label { display: grid; gap: 6px; }
        #aliasInput { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
        .alias-actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .alias-actions button { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); cursor: pointer; }
        .alias-actions button[type="submit"] { background: var(--teal); color: white; }
        .alias-actions button:disabled { opacity: .55; cursor: wait; }
        #deviceGroups { display: grid; gap: 10px; }
        .device-group summary { cursor: pointer; }
        .device-group summary small { margin-inline-start: 10px; }
        .device-group[open] summary { margin-bottom: 10px; }
        .device-group td small { display: block; overflow-wrap: anywhere; }
        .overview-chart, .chart-grid { margin-top: 16px; }
        .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 390px), 1fr)); gap: 12px; }
        .flow-surface { overflow: auto; }
        .flow-surface canvas { width: 100%; min-width: 620px; display: block; }
        #priceChart { width: 100%; display: block; }
        #priceChart[hidden] { display: none; }
        .flow-detail summary { cursor: pointer; }
        .history-row { display: grid; grid-template-columns: minmax(0, 7.5em) minmax(0, 1fr) minmax(0, 6em); gap: 8px; align-items: center; }
        .history-row progress { width: 100%; accent-color: var(--teal); }
        .history-row small { overflow-wrap: anywhere; }
        .history-row small:last-child { text-align: end; }
        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 255px), 1fr));
            align-items: start;
            gap: 14px;
        }
        .room-card { padding: 16px; box-shadow: 0 3px 10px #1831350a; }
        .room-heading { display: flex; align-items: center; gap: 11px; }
        .room-heading h3 { font-size: 17px; overflow-wrap: anywhere; }
        .room-icon {
            display: grid;
            place-items: center;
            flex: 0 0 38px;
            height: 38px;
            border-radius: 11px;
            color: #075b52;
            background: #dff1ed;
            font-size: 24px;
            line-height: 1;
        }
        .room-power { display: grid; gap: 2px; margin: 13px 0; }
        .room-power .value { font-size: 29px; line-height: 1.1; }
        .room-power > span { color: var(--muted); font-size: 13px; }
        .room-card details, .room-device-count { border-top: 1px solid var(--line); padding-top: 10px; }
        .room-card summary { cursor: pointer; color: #075b52; font-weight: 650; }
        .room-device-list { list-style: none; padding: 0; margin: 8px 0 0; }
        .room-device-list li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 13px; }
        .room-device-list li + li { border-top: 1px solid var(--line); }
        .room-device-list li > span:first-child { overflow-wrap: anywhere; }
        .room-device-list small { display: block; }
        .room-device-power { white-space: nowrap; font-variant-numeric: tabular-nums; }
        .header-actions, .project-links { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
        .github-button { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; background: var(--paper); color: var(--ink); font-weight: 600; text-decoration: none; }
        .github-button:hover { border-color: var(--teal); color: var(--teal); }
        .project-footer { border-top: 1px solid var(--line); margin-top: 24px; padding: 16px 0; color: var(--muted); font-size: 13px; text-align: center; }
        .project-footer .project-links { justify-content: center; margin-top: 8px; }
    </style>
    <script defer src="dashboard.js?v=0.3.0-beta.14"></script>
</head>
<body>
<main>
    <header>
        <div><h1>Energy Manager</h1><p id="status" role="status"></p></div>
        <div class="header-actions">
            <label>ioBroker <select id="instance" aria-label="ioBroker instance"></select></label>
            <a class="github-button" href="https://github.com/hotwin/ioBroker.hotwin-energy-manager" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
    </header>
    <nav id="navigation" aria-label="Energy Manager"></nav>
    <section id="overview" data-page>
        <h2 data-text="overview"></h2>
        <div class="summary-grid">
            <section id="meterSummary" class="surface summary-panel" hidden>
                <h3 data-text="houseMeter"></h3>
                <div id="meterMetrics" class="summary-metrics"></div>
                <small id="meterStatus" class="summary-note" hidden></small>
            </section>
            <section class="surface summary-panel">
                <h3 data-text="measuredDevices"></h3>
                <div id="deviceMetrics" class="summary-metrics"></div>
            </section>
            <section class="surface summary-panel">
                <h3 data-text="prices"></h3>
                <div id="priceMetrics" class="summary-metrics"></div>
                <small id="priceValidity" class="summary-note"></small>
                <small id="summaryTariffStatus" class="summary-note" hidden></small>
            </section>
        </div>
        <div id="energyInsights" class="surface overview-chart" hidden>
            <h2 data-text="insightsTitle"></h2>
            <p id="insightsComparison"></p>
            <p id="insightsPrice"></p>
        </div>
        <div class="surface overview-chart">
            <div class="stats-header">
                <h2 data-text="energyFlow"></h2>
                <label><span data-text="period"></span> <select id="flowPeriod"></select></label>
            </div>
            <div id="flowChart"></div>
        </div>
        <div class="chart-grid">
            <div class="surface"><h2 data-text="hourlyUsage"></h2><div id="hourChart"></div></div>
            <div class="surface"><h2 data-text="weeklyCosts"></h2><div id="costChart"></div></div>
        </div>
        <div class="surface overview-chart">
            <h2 data-text="priceHistory"></h2>
            <p class="note" data-text="priceChartLegend"></p>
            <canvas id="priceChart" width="900" height="220" role="img"></canvas>
            <p id="priceHistoryStatus" class="note"></p>
        </div>
    </section>
    <section id="devices" data-page hidden>
        <h2 data-text="devices"></h2><p class="note" data-text="deviceHint"></p>
        <p class="note" data-text="coverage"></p>
        <div id="deviceGroups"></div>
        <template id="deviceGroupTemplate">
            <details class="surface device-group">
                <summary></summary>
                <div class="scroll"><table>
                    <thead><tr><th data-text="device"></th><th data-text="power"></th><th data-text="meter"></th><th data-text="source"></th></tr></thead>
                    <tbody></tbody>
                </table></div>
            </details>
        </template>
    </section>
    <dialog id="aliasDialog" aria-labelledby="aliasTitle" class="surface">
        <form id="aliasForm">
            <h2 id="aliasTitle" data-text="editName"></h2>
            <p class="note" id="originalDeviceName"></p>
            <label><span data-text="device"></span> <input id="aliasInput" maxlength="120" required></label>
            <p id="aliasStatus" class="note" role="status"></p>
            <div class="alias-actions">
                <button type="submit" data-text="saveName"></button>
                <button id="cancelAlias" type="button" data-text="cancelName"></button>
                <button id="resetAlias" type="button" data-text="resetName"></button>
            </div>
        </form>
    </dialog>
    <section id="rooms" data-page hidden>
        <h2 data-text="rooms"></h2><div id="roomCards" class="room-grid"></div>
    </section>
    <section id="statistics" data-page hidden>
        <h2 data-text="statistics"></h2>
        <div class="surface">
            <div class="stats-header"><strong id="statsTotal"></strong><label><span data-text="period"></span> <select id="period"></select></label></div>
            <div id="statsBars"></div><p class="note" data-text="costHint"></p>
        </div>
    </section>
    <section id="prices" data-page hidden>
        <h2 data-text="prices"></h2><p class="note" data-text="priceHint"></p>
        <div class="surface scroll"><table>
            <thead><tr><th data-text="start"></th><th data-text="end"></th><th data-text="market"></th><th data-text="tariff"></th></tr></thead>
            <tbody id="priceRows"></tbody>
        </table></div>
    </section>
    <section id="contract" data-page hidden>
        <h2 data-text="contract"></h2><div id="contractCards" class="grid"></div>
        <p class="note" id="tariffStatus" role="status"></p>
        <p class="note" id="contractWebHint" data-text="contractWebHint" hidden></p>
        <form class="surface" id="contractForm" hidden>
            <fieldset disabled>
                <legend class="note" data-text="contractHint"></legend>
                <div class="contract-fields">
                    <label><span data-text="provider"></span><input name="provider" maxlength="120"></label>
                    <label><span data-text="tariffName"></span><input name="tariffName" maxlength="120"></label>
                    <label><span data-text="contractStart"></span><input name="contractStart" type="date" max="9999-12-31"></label>
                    <label><span data-text="tariffFormula"></span><select name="tariffFormula">
                        <option value="additive" data-text="additive"></option>
                        <option value="awattarHourly" data-text="awattarHourly"></option>
                        <option value="unsupported" data-text="unsupported"></option>
                    </select></label>
                    <label><span data-text="baseMonthly"></span><input name="baseMonthly" inputmode="decimal"></label>
                    <label><span data-text="meterAnnual"></span><input name="meterAnnual" inputmode="decimal"></label>
                    <label><span data-text="markupCt"></span><input name="markupCt" inputmode="decimal" data-variable></label>
                    <label><span data-text="networkCt"></span><input name="networkCt" inputmode="decimal" data-variable></label>
                    <label><span data-text="electricityTaxCt"></span><input name="electricityTaxCt" inputmode="decimal" data-variable></label>
                    <label><span data-text="concessionCt"></span><input name="concessionCt" inputmode="decimal" data-variable></label>
                    <label><span data-text="leviesCt"></span><input name="leviesCt" inputmode="decimal" data-variable></label>
                    <label><span data-text="vatPercent"></span><input name="vatPercent" inputmode="decimal" data-variable data-percent></label>
                    <label><span data-text="advanceMonthly"></span><input name="advanceMonthly" inputmode="decimal"></label>
                    <label data-hourly><span data-text="marketMarkupPercent"></span><input name="marketMarkupPercent" inputmode="decimal" data-variable data-percent></label>
                    <label data-hourly><span data-text="energyMinGrossCt"></span><input name="energyMinGrossCt" inputmode="decimal" data-limit></label>
                    <label data-hourly><span data-text="energyMaxGrossCt"></span><input name="energyMaxGrossCt" inputmode="decimal" data-limit></label>
                </div>
                <p class="note"><label><input name="tariffConfigured" type="checkbox"> <span data-text="tariffConfigured"></span></label></p>
                <button type="submit" data-text="saveContract"></button>
            </fieldset>
            <p class="note" id="contractSaveStatus" role="status"></p>
        </form>
    </section>
    <section id="updates" data-page hidden>
        <h2 data-text="updates"></h2>
        <div class="surface"><p id="installed"></p>
            <div class="project-links">
                <a href="https://github.com/hotwin/ioBroker.hotwin-energy-manager/releases" target="_blank" rel="noopener noreferrer" data-text="releases"></a>
                <a href="https://github.com/hotwin/ioBroker.hotwin-energy-manager/blob/main/README.md#changelog" target="_blank" rel="noopener noreferrer" data-text="projectChangelog"></a>
                <a href="https://github.com/hotwin/ioBroker.hotwin-energy-manager/issues" target="_blank" rel="noopener noreferrer" data-text="projectIssues"></a>
            </div>
        </div>
    </section>
    <footer class="project-footer">
        <p><span data-text="projectResponsible"></span> <strong>Böttcher Services</strong></p>
        <div class="project-links">
            <a href="https://github.com/hotwin/ioBroker.hotwin-energy-manager" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://github.com/hotwin/ioBroker.hotwin-energy-manager/issues" target="_blank" rel="noopener noreferrer" data-text="projectIssues"></a>
            <a href="https://github.com/hotwin/ioBroker.hotwin-energy-manager/releases" target="_blank" rel="noopener noreferrer" data-text="projectReleases"></a>
        </div>
    </footer>
</main>
</body>
</html>
