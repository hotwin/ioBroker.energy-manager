<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy Manager</title><style>body{font:16px system-ui;background:#f4f6f8;color:#243247;margin:0}main{max-width:1100px;margin:auto;padding:24px}h1{color:#176b52}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.tile,section{background:white;border:1px solid #e0e6eb;border-radius:16px;padding:20px;margin-bottom:16px}.value{font-size:30px;font-weight:700;margin-top:10px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #eee;overflow-wrap:anywhere}small{color:#596779}button{padding:10px;border:1px solid #ccc;border-radius:8px;background:white}</style><main><h1>⚡ Energy Manager</h1><p id="status">Warte auf Messwerte …</p><div class="grid"><div class="tile">Erfasste Leistung<div class="value" id="power">–</div></div><div class="tile">Börsenpreis<div class="value" id="market">–</div></div><div class="tile">Geschätzter Tarifpreis<div class="value" id="tariff">–</div></div></div><section><h2>Geräte</h2><table><thead><tr><th>Messstelle</th><th>Leistung</th><th>Zählerstand</th></tr></thead><tbody id="devices"></tbody></table></section><section><h2>Preisvorschau</h2><div id="prices"></div></section><small>Nur erfasste Messstellen. Überlappende Messstellen können doppelt zählen. Börsenpreis ohne Vertragsbestandteile.</small><p><label>JSON-Momentaufnahme zum Testen: <input type="file" id="file" accept=".json"></label></p></main><script>const el=id=>document.getElementById(id),fmt=(v,u)=>typeof v==='number'&&Number.isFinite(v)?v.toLocaleString('de-DE',{maximumFractionDigits:2})+' '+u:'–';function render(s){el('status').textContent='Messstand: '+new Date(s.ts).toLocaleString('de-DE');el('power').textContent=fmt(s.totalPower,'W');el('market').textContent=fmt(s.marketCt,'ct/kWh');el('tariff').textContent=fmt(s.tariffCt,'ct/kWh');el('devices').replaceChildren();for(const d of s.devices||[]){const tr=document.createElement('tr');for(const v of [d.name||d.id,fmt(d.powerW,'W'),fmt(d.energyKWh,'kWh')]){const td=document.createElement('td');td.textContent=v;tr.append(td)}el('devices').append(tr)}el('prices').replaceChildren();for(const p of (s.prices||[]).filter(p=>p.end_timestamp>Date.now()).slice(0,96)){const row=document.createElement('p');row.textContent=new Date(p.start_timestamp).toLocaleString('de-DE')+' · '+fmt(p.marketprice/10,'ct/kWh');el('prices').append(row)}}el('file').onchange=async e=>{try{render(JSON.parse(await e.target.files[0].text()))}catch{el('status').textContent='Ungültige JSON-Datei'}};async function refresh(){try{const instance=new URLSearchParams(location.search).get('instance')||'0';if(!/^\d+$/.test(instance))throw Error('Invalid instance');const response=await fetch('/get/energy-manager.'+instance+'.snapshot',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const state=await response.json();render(typeof state.val==='string'?JSON.parse(state.val):state.val);}catch(e){el('status').textContent='Keine Live-Verbindung. Web-API prüfen oder JSON importieren.';}}refresh();setInterval(refresh,60000);</script></html>
