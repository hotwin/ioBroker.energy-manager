<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Energy Manager</title>
    <style>
        :root { color-scheme: light; --ink: #183135; --muted: #50666b; --teal: #08796e; --line: #d6e5e3; --paper: #fff; }
        * { box-sizing: border-box; }
        body { margin: 0; color: var(--ink); background: #f0f6f5; font: 15px/1.5 system-ui, sans-serif; }
        main { margin: auto; max-width: 1260px; padding: clamp(16px, 4vw, 44px); }
        header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
        h1, h2, h3, p { margin: 0; }
        h1 { font-size: clamp(25px, 5vw, 38px); letter-spacing: -.045em; }
        h2 { font-size: 22px; margin-bottom: 14px; }
        nav { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 24px; }
        nav a { padding: 8px 11px; border-radius: 8px; text-decoration: none; font-weight: 600; }
        a { color: var(--teal); }
        nav a[aria-current] { background: #dff1ed; color: #075b52; }
        :focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 12px; }
        article, .surface { padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
        article p, small, #status, .note { color: var(--muted); }
        .value { display: block; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 25px; overflow-wrap: anywhere; }
        .tile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 205px), 1fr));
            gap: 10px;
        }
        .overview-tile {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 84px;
            padding: 12px;
            color: var(--ink);
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 14px;
            text-decoration: none;
        }
        .overview-tile:hover { border-color: var(--teal); background: #f9fdfd; }
        .tile-icon {
            display: grid;
            place-items: center;
            flex: 0 0 42px;
            height: 42px;
            border-radius: 50%;
            color: #086b91;
            background: #e0f2fa;
            font-size: 23px;
            font-weight: 700;
        }
        .overview-tile:nth-child(3) .tile-icon,
        .overview-tile:nth-child(5) .tile-icon { color: #08695d; background: #dff1ed; }
        .tile-content { min-width: 0; }
        .tile-label { display: block; color: var(--muted); font-size: 13px; line-height: 1.3; }
        .tile-value { display: block; margin-top: 3px; font-size: 19px; font-variant-numeric: tabular-nums; }
        .scroll { overflow: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { border-bottom: 1px solid var(--line); padding: 10px; }
        th, td:not(:first-child) { white-space: nowrap; }
        td:first-child { min-width: 130px; overflow-wrap: anywhere; }
        .stats-header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
        select { padding: 6px; font: inherit; max-width: 100%; }
        #statsBars { display: grid; gap: 5px; max-height: 520px; overflow: auto; }
        .stat-row { display: grid; grid-template-columns: 85px minmax(20px, 1fr) 95px; gap: 6px; align-items: center; }
        progress { width: 100%; accent-color: var(--teal); }
        .note { margin-block: 12px; }
        [hidden] { display: none !important; }
    </style>
    <script defer src="dashboard.js"></script>
</head>
<body>
<main>
    <header>
        <div><h1>Energy Manager</h1><p id="status" role="status"></p></div>
        <label>ioBroker <select id="instance" aria-label="ioBroker instance"></select></label>
    </header>
    <nav id="navigation" aria-label="Energy Manager"></nav>
    <section id="overview" data-page>
        <h2 data-text="overview"></h2><div id="summary" class="tile-grid"></div>
        <p class="note" data-text="coverage"></p>
    </section>
    <section id="devices" data-page hidden>
        <h2 data-text="devices"></h2><p class="note" data-text="deviceHint"></p>
        <div class="surface scroll"><table>
            <thead><tr><th data-text="device"></th><th data-text="room"></th><th data-text="power"></th><th data-text="meter"></th><th data-text="source"></th></tr></thead>
            <tbody id="deviceRows"></tbody>
        </table></div>
    </section>
    <section id="rooms" data-page hidden>
        <h2 data-text="rooms"></h2><div id="roomCards" class="grid"></div>
    </section>
    <section id="statistics" data-page hidden>
        <h2 data-text="statistics"></h2>
        <div class="surface">
            <div class="stats-header"><strong id="statsTotal"></strong><label><span data-text="period"></span> <select id="period"></select></label></div>
            <div id="statsBars"></div><p class="note" data-text="costHint"></p>
        </div>
    </section>
    <section id="prices" data-page hidden>
        <h2 data-text="prices"></h2><p class="note" data-text="priceHint"></p>
        <div class="surface scroll"><table>
            <thead><tr><th data-text="start"></th><th data-text="end"></th><th data-text="market"></th><th data-text="tariff"></th></tr></thead>
            <tbody id="priceRows"></tbody>
        </table></div>
    </section>
    <section id="contract" data-page hidden>
        <h2 data-text="contract"></h2><div id="contractCards" class="grid"></div>
        <p class="note" data-text="contractHint"></p>
    </section>
    <section id="updates" data-page hidden>
        <h2 data-text="updates"></h2>
        <div class="surface"><p id="installed"></p>
            <a href="https://github.com/hotwin/ioBroker.energy-manager/releases" target="_blank" rel="noopener noreferrer" data-text="releases"></a>
        </div>
    </section>
</main>
</body>
</html>
